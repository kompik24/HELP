name: Build HELP apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/build-help-apps.yml'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: apps/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HELP-Android-APK
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/windows
        run: npm install
      - name: Build installer
        working-directory: apps/windows
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: HELP-Windows-Installer
          path: apps/windows/dist/*.exe
          if-no-files-found: error
